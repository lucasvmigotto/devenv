name: Release

on:
  push:
    branches:
      - main
    paths:
      - docs/site/package.json

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version docs/site/package.json)" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Ask the remote: the checkout is shallow and carries no tags, so a
          # local `git rev-parse` never sees an existing release tag.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists, skipping."
            exit 0
          fi
          git tag "$VERSION"
          git push origin "$VERSION"
