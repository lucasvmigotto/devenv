name: Bun

on:
  push:
    branches:
      - main
    paths:
      - "**/bun.Dockerfile"
      - "**/bun.yml"
      - "**/base.Dockerfile"
      - "**/base.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Base"
    types:
      - completed
    branches:
      - main

env:
  REGISTRY_GH: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  bun-debian:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      devenv: bun
      distro-name: debian
    strategy:
      matrix:
        version:
          - "1.3.9"
        distro-version:
          - trixie
          - bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Docker Hub Container registry
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GH }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_GH }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v3
        with:
          file: .docker/${{ env.devenv }}.Dockerfile
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}/${{ env.devenv }}:${{ matrix.version }}-${{ matrix.distro-version }}
            ${{ env.REGISTRY_GH }}/${{ env.IMAGE_NAME }}/${{ env.devenv }}:${{ matrix.version }}-${{ matrix.distro-version }}
          build-args: |
            _VERSION=${{ matrix.version }}
            _DISTRO_NAME=${{ env.distro-name }}
            _DISTRO_VERSION=${{ matrix.distro-version }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY_GH }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
