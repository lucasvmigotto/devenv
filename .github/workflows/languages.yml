name: Languages

on:
  workflow_run:
    workflows:
      - Base
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate build matrix
        id: gen
        run: echo "matrix=$(python3 build/gen-matrix.py lang)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.matrix) }}
    uses: ./.github/workflows/build-image.yml
    with:
      file: .docker/${{ matrix.name }}.Dockerfile
      context: .
      tags: ${{ matrix.tag }}
      build-args: |
        _VERSION=${{ matrix.version }}
        _DISTRO_NAME=${{ matrix.distro }}
        _DISTRO_VERSION=${{ matrix.base_version }}
      extra-args: |
        ${{ matrix.jdk != '' && format('_JAVA_VERSION={0}', matrix.jdk) || '' }}
        ${{ matrix.pm != '' && format('_PKG_MANAGER={0}', matrix.pm) || '' }}
      cache-scope: lang-${{ matrix.name }}-${{ matrix.distro }}
    secrets: inherit

  description:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Substitute ##VERSION## placeholder
        run: sed "s/##VERSION##/$(cat VERSION)/g" dockerhub.README.md > /tmp/dockerhub.README.md

      - name: Push description to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
          repository: lucasvmigotto/devenv
          readme-filepath: /tmp/dockerhub.README.md
