name: Base

on:
  workflow_run:
    workflows: [ Release ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate build matrix
        id: gen
        run: echo "matrix=$(python3 build/gen-matrix.py base)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.matrix) }}
    uses: ./.github/workflows/build-image.yml
    with:
      file: .docker/base.Dockerfile
      context: .
      tags: ${{ matrix.tag }}
      extra-tags: ${{ matrix.alias }}
      build-args: |
        _BASE_IMAGE=${{ matrix.base_image }}
        _DISTRO=${{ matrix.distro }}
        _PRIV_TOOL=${{ matrix.priv }}
      cache-scope: base-${{ matrix.distro }}-${{ matrix.version }}
    secrets: inherit
