name: Java

on:
  push:
    branches: [main]
    paths:
      - "**/java.Dockerfile"
      - "**/java.yml"
      - "**/base.Dockerfile"
      - "**/base.yml"
  workflow_run:
    workflows: ["Base"]
    types: [completed]
    branches: [main]

env:
  REGISTRY_GH: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  push-docker-image:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        version:
          - "25"
          - "21"
          - "17"
        distro-name:
          - debian
        distro-version:
          - trixie
          - bookworm
        distro-variant:
          - slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Docker Hub Container registry
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Log in to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GH }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_GH }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v3
        with:
          file: .docker/java.Dockerfile
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:java-${{ matrix.version }}-${{ matrix.distro-version }}
            ${{ env.REGISTRY_GH }}/${{ env.IMAGE_NAME }}:java-${{ matrix.version }}-${{ matrix.distro-version }}
          build-args: |
            _VERSION=${{ matrix.version }}
            _DISTRO_NAME=${{ matrix.distro-name }}
            _DISTRO_VERSION=${{ matrix.distro-version }}
            _DISTRO_VARIANT=${{ matrix.distro-variant }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY_GH }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
