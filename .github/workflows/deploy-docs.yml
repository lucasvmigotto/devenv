name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - build/manifest.json
      - .docker/*.Dockerfile
      - README.md
      - dockerhub.README.md
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI (lint, typecheck, build)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Set version
        id: version
        run: |
          VERSION=$(bun -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: devenv-docs-${{ steps.version.outputs.VERSION }}
          path: |
            docs/dist/
          retention-days: 7
          if-no-files-found: error

  cd:
    name: CD (deploy to Cloudflare R2)
    runs-on: ubuntu-24.04
    needs: [ci]
    permissions:
      contents: read

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: devenv-docs-${{ needs.ci.outputs.version }}
          path: .

      - name: Validate R2 endpoint
        run: |
          ENDPOINT="${{ vars.CLOUDFLARE_R2_ENDPOINT_S3_CLIENT }}"
          if [ -z "$ENDPOINT" ]; then
            echo "::error::CLOUDFLARE_R2_ENDPOINT_S3_CLIENT repo variable is not set"
            exit 1
          fi
          case "$ENDPOINT" in
            https://*) echo "R2 endpoint OK: $ENDPOINT" ;;
            *) echo "::error::CLOUDFLARE_R2_ENDPOINT_S3_CLIENT must start with https:// (got: $ENDPOINT)"; exit 1 ;;
          esac

      - name: Ensure AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq awscli
          fi
          aws --version
